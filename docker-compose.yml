# Local internal stack. Published ports bind 127.0.0.1 only (no public ingress).
# Secrets have no defaults: compose refuses to start until ${NAME:?...} is set.
services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: proba-llm:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3600:3600"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3600"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: deepseek
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL}
      LLM_ALLOWED_HOSTS: ${LLM_ALLOWED_HOSTS:?set LLM_ALLOWED_HOSTS}
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:?set LLM_ALLOWED_MODELS}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY}
      GATEWAY_SERVICE_PUBLIC_KEY_FILE: /run/secrets/gateway_jwks
      CALLER_ISSUERS: proba-gateway
      CALLER_SUBJECTS: gateway
      AUDIT_PUBLISHER: redis
      AUDIT_STREAM: proba.audit.events
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      AUDIT_CONTENT_ENABLED: "true"
      AUDIT_CONTENT_MASK_PII: "true"
      TURN_STORE_DIR: /app/data/turns
    secrets:
      - gateway_jwks
    depends_on:
      redis:
        condition: service_started
    volumes:
      - llm_turn_data:/app/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    restart: unless-stopped
    user: "999:1000"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - llm_redis_data:/data

secrets:
  gateway_jwks:
    file: ${GATEWAY_JWKS_FILE:?set GATEWAY_JWKS_FILE}

volumes:
  llm_redis_data:
  llm_turn_data:
